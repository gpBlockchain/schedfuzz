[package]
name = "schedfuzz"
version = "0.1.0"
edition = "2021"

[dependencies]
ckb-chain-spec-patch = { package = "ckb-chain-spec", git = "https://github.com/nervosnetwork/ckb", tag = "v0.204.0" }
ckb-error-patch = { package = "ckb-error", git = "https://github.com/nervosnetwork/ckb", tag = "v0.204.0" }
ckb-script-patch = { package = "ckb-script", git = "https://github.com/nervosnetwork/ckb", tag = "v0.204.0", default-features = false }
