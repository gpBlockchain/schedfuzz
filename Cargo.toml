ckb-chain-spec-sched = { package = "ckb-chain-spec", git = "https://github.com/gpBlockchain/ckb", branch = "copilot/update-ckb-vm-to-asm-rv64im" }
ckb-error-sched = { package = "ckb-error", git = "https://github.com/gpBlockchain/ckb", branch = "copilot/update-ckb-vm-to-asm-rv64im" }
ckb-script-sched = { package = "ckb-script", git = "https://github.com/gpBlockchain/ckb", branch = "copilot/update-ckb-vm-to-asm-rv64im", default-features = false }
ckb-traits-sched = { package = "ckb-traits", git = "https://github.com/gpBlockchain/ckb", branch = "copilot/update-ckb-vm-to-asm-rv64im" }
ckb-types-sched = { package = "ckb-types", git = "https://github.com/gpBlockchain/ckb", branch = "copilot/update-ckb-vm-to-asm-rv64im" }
